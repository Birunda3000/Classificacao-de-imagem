
services:
  # Define o serviço principal do seu ambiente de desenvolvimento.
  image_classification_dev:
    # Constrói a imagem Docker a partir do Dockerfile localizado no diretório atual.
    build: .
    # Nome amigável para o container. Facilita o gerenciamento via 'docker ps'.
    container_name: image_classification_container
    # Habilita o runtime da NVIDIA, permitindo acesso e otimização da GPU.
    runtime: nvidia
    # Mapeia portas do host para o container.
    # Mantemos a porta 8888 mapeada, mesmo que não use o Jupyter Lab via navegador,
    # para flexibilidade futura ou depuração via navegador.
    ports:
      - "8888:8888"
    # Variáveis de ambiente definidas dentro do container.
    # Silencia mensagens INFO do TensorFlow C++ para uma saída mais limpa.
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
    # Mapeia volumes (pastas) entre o host (Windows/WSL2) e o container.
    volumes:
      # Mapeia o diretório atual do seu repositório Git (no host) para o diretório de trabalho no container.
      # Permite edição de código em tempo real no VS Code.
      - .:/tf/TCC_GAN
      # Mapeia sua pasta de dados de entrada/saída no host para dentro do container.
      - ./data:/tf/data_project
    # Define o diretório de trabalho padrão dentro do container para este serviço.
    # O VS Code abrirá este diretório.
    working_dir: /tf/TCC_GAN
    # O comando que mantém o container ativo. O VS Code anexará a este shell.
    #stdin_open: true
    #tty: true
    #command: bash
    command: ["/bin/bash", "-c", "while true; do sleep infinity; done"]
    # As linhas stdin_open e tty não são mais necessárias com o comando acima.
    # Elas podem ser omitidas.